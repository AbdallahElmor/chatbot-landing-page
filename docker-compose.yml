services:
  # ── Backend (FastAPI + RAG Pipeline) ────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synkro-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - CHUNKS_PATH=/app/data/Synkro-data.json
    volumes:
      # Knowledge base data – read-only for the backend
      - ./data:/app/data:ro
      # HuggingFace / sentence-transformers model cache
      # Persists the ~2 GB BAAI/bge-m3 download across rebuilds
      - model-cache:/home/appuser/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  model-cache:
    driver: local